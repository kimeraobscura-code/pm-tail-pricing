# Vale — 산문 린터. LLM 호출 0, 결정적.
# 대상: 영문 원고(README.md)와 사전등록 문서. README.ko.md 는 한국어라 영문 규칙 제외.
# 주의: .vale.ini 값은 쉼표로 분리된다. 정규식에 {n,m} 수량자를 쓰지 말 것.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Paper

[*.md]
BasedOnStyles = Vale, PaperVoice
Vale.Spelling = YES
# 이 원고는 대시를 의도적으로 쓴다(학술 영문에서 정당한 쓰임). 켜면 19건 울린다.
# 외부 기고문처럼 대시를 빼야 하는 글에서는 아래 줄을 YES 로.
PaperVoice.EmDash = NO
TokenIgnores = (\$[^\n$]+\$), (`[^`]+`), (\b[A-Z][A-Z0-9._-]+\b), ([ρσΦμΔθλ]\S*), (\d+\.?\d*(pp|bp|¢|×))

# 한국어 원고: 영문 문체 규칙은 전부 오탐이라 끈다.
[README.ko.md]
BasedOnStyles =
Vale.Spelling = NO

[prereg/PREREG*.md]
BasedOnStyles = Vale, PaperVoice
Vale.Spelling = NO
